name: Benchmark Regression Check

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr-branch
          fetch-depth: 0

      - name: Checkout main (baseline)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build PR branch
        run: |
          cd pr-branch
          npm install
          npm run build
          npm run build:benchmark

      - name: Install & build main branch
        run: |
          cd main-branch
          npm install
          npm run build
          npm run build:benchmark
        continue-on-error: true   # siehe Punkt 3 (Initial-Fall)
        id: build_main

      - name: Run comparison
        run: |
          node pr-branch/dist-benchmark/compare.js \
            --current pr-branch \
            --baseline main-branch \
            --threshold 10
        id: compare

      - name: Post result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('benchmark-result.md', 'utf-8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });